<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fa" />
    <meta name="description" content="대화의 맥락을 기억하는 간단한 AI 챗봇" />
    <title>모아 — AI 챗봇</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="대화 메뉴">
        <a class="brand" href="/" aria-label="모아 홈"><span class="brand-mark">m</span><span>moa</span></a>
        <button class="new-chat" id="new-chat" type="button"><span aria-hidden="true">＋</span> 새 대화</button>
        <div class="sidebar-label">WORKSPACE</div>
        <div class="conversation-item"><span class="conversation-dot"></span><span>오늘의 대화</span><span class="active-indicator"></span></div>
        <div class="sidebar-bottom">
          <div class="privacy-card"><span class="privacy-icon">✳</span><div><strong>대화는 이 기기에만</strong><p>새로고침하면 대화가 초기화돼요.</p></div></div>
          <div class="profile"><div class="avatar">나</div><div><strong>내 작업 공간</strong><span>개인용</span></div><span class="more">···</span></div>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar"><button class="mobile-brand" id="mobile-new-chat" type="button"><span class="brand-mark">m</span> moa</button><div class="model-pill"><span class="online-dot"></span> GPT-4o mini <span class="chevron">⌄</span></div><button class="icon-button" id="clear-chat" type="button" aria-label="대화 초기화" title="대화 초기화">↻</button></header>
        <section class="chat-area" id="chat-area" aria-live="polite">
          <div class="welcome" id="welcome">
            <div class="welcome-orb"><span>✳</span></div>
            <p class="eyebrow">YOUR THOUGHT PARTNER</p>
            <h1>무엇이든 함께<br /><span>생각해 볼까요?</span></h1>
            <p class="welcome-copy">아이디어부터 궁금한 것까지,<br class="mobile-break" /> 편하게 이야기해 주세요.</p>
            <div class="suggestions">
              <button class="suggestion" type="button" data-prompt="새로운 프로젝트 아이디어를 함께 브레인스토밍하고 싶어."><span class="suggestion-icon violet">✧</span><span><strong>아이디어 브레인스토밍</strong><small>새 프로젝트의 첫 단추 찾기</small></span><span class="suggestion-arrow">↗</span></button>
              <button class="suggestion" type="button" data-prompt="복잡한 내용을 쉽게 설명해 줘. 예를 들면 머신러닝이 뭐야?"><span class="suggestion-icon orange">⌘</span><span><strong>어려운 개념 쉽게 설명</strong><small>복잡한 것도 차근차근</small></span><span class="suggestion-arrow">↗</span></button>
              <button class="suggestion" type="button" data-prompt="오늘 하루를 잘 정리할 수 있도록 질문을 하나씩 해 줘."><span class="suggestion-icon green">☼</span><span><strong>하루 돌아보기</strong><small>생각을 정리하는 시간</small></span><span class="suggestion-arrow">↗</span></button>
            </div>
          </div>
          <div class="messages" id="messages"></div>
        </section>
        <footer class="composer-wrap">
          <form class="composer" id="chat-form"><textarea id="message-input" rows="1" placeholder="모아에게 무엇이든 물어보세요..." aria-label="메시지 입력" maxlength="8000"></textarea><div class="composer-tools"><span class="composer-hint"><kbd>Enter</kbd> 전송 · <kbd>Shift + Enter</kbd> 줄바꿈</span><button class="send-button" id="send-button" type="submit" aria-label="메시지 전송"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6" /></svg></button></div></form>
          <p class="disclaimer">모아의 답변은 부정확할 수 있어요. 중요한 내용은 한 번 더 확인해 주세요.</p>
        </footer>
      </main>
    </div>
  </body>
</html>
